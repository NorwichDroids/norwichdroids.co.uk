<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Events — Norwich Droids</title>
<meta name="description" content="Norwich Droids — a Norfolk-based group building lifelike Star Wars droids: R2 units, BB-series builds and more.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Exo+2:wght@500;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div class="site-nav">
  <a class="brand" href="/">
    <img src="/img/logo-nav.png" alt="Norwich Droids logo">
    <div class="wordmark">NORWICH<br><span>DROIDS</span></div>
  </a>
  <div class="links">
    <a href="/">Home</a>
    <a href="/about.html">About</a>
    <a href="/events.html" class="active">Events</a>
    <a href="/gallery.html">Gallery</a>
    <a class="btn btn-primary" href="/members/login">Members Login</a>
  </div>
</div>

<main>

<div class="page-header">
  <h1>Events &amp; Appearances</h1>
  <p class="lede">Catch us out and about across Norfolk and beyond.</p>
</div>

<div class="container">
  <div class="event-list" id="event-list">
    <p class="sub">Loading events&hellip;</p>
  </div>
</div>

</main>

<script>
(function () {
  var list = document.getElementById('event-list');

  function showMessage(text) {
    list.innerHTML = '';
    var p = document.createElement('p');
    p.className = 'sub';
    p.textContent = text;
    list.appendChild(p);
  }

  fetch('/api/events').then(function (r) {
    if (!r.ok) throw new Error('bad response');
    return r.json();
  }).then(function (events) {
    if (!Array.isArray(events) || events.length === 0) {
      showMessage('No upcoming events right now — check back soon.');
      return;
    }
    list.innerHTML = '';
    events.forEach(function (ev) {
      var hasLink = !!ev.url;
      var row = document.createElement(hasLink ? 'a' : 'div');
      row.className = 'event-row';
      if (hasLink) {
        row.href = ev.url;
        row.target = '_blank';
        row.rel = 'noopener noreferrer';
      }

      var dateDiv = document.createElement('div');
      dateDiv.className = 'event-date';
      var dayDiv = document.createElement('div');
      dayDiv.className = 'day' + (ev.daySmall ? ' small' : '');
      dayDiv.textContent = ev.day || '';
      dateDiv.appendChild(dayDiv);
      var monthDiv = document.createElement('div');
      monthDiv.className = 'month';
      monthDiv.textContent = ev.month || '';
      dateDiv.appendChild(monthDiv);
      if (ev.year) {
        var yearDiv = document.createElement('div');
        yearDiv.className = 'year';
        yearDiv.textContent = ev.year;
        dateDiv.appendChild(yearDiv);
      }
      row.appendChild(dateDiv);

      var infoDiv = document.createElement('div');
      infoDiv.className = 'event-info';
      var titleDiv = document.createElement('div');
      titleDiv.className = 'title';
      titleDiv.textContent = ev.title || '';
      infoDiv.appendChild(titleDiv);
      var locDiv = document.createElement('div');
      locDiv.className = 'loc';
      locDiv.textContent = ev.location || '';
      infoDiv.appendChild(locDiv);
      row.appendChild(infoDiv);

      if (hasLink) {
        var linkDiv = document.createElement('div');
        linkDiv.className = 'event-link';
        var span = document.createElement('span');
        span.textContent = 'More details';
        linkDiv.appendChild(span);
        linkDiv.insertAdjacentHTML('beforeend', '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#3f6b4a" stroke-width="2.2"><path d="M7 17 L17 7 M9 7 L17 7 L17 15"/></svg>');
        row.appendChild(linkDiv);
      }

      list.appendChild(row);
    });
  }).catch(function () {
    showMessage('Events are unavailable right now.');
  });
})();
</script>

<div class="site-footer">
  <div class="brand">
    <img src="/img/logo2-badge.png" alt="Norwich Droids emblem">
    <div class="text">Norwich Droids &mdash; Norfolk, UK</div>
  </div>
  <div class="text">info@norwichdroids.co.uk</div>
</div>

</body>
</html>
